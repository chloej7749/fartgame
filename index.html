<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where will you sit?</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Andale Mono', monospace;
    background: #1e3d59;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.game-container {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 500px;
    width: 100%;
    text-align: center;
}

h1 {
    color: #333;
    margin-bottom: 10px;
    font-size: 24px;
    line-height: 1.3;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
    font-size: 16px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}
.matthew img {
    width: 80%;
    height: 80%;
}

.seat {
    aspect-ratio: 1;
    background: #f0f0f0;
    border: 3px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.seat.selected {
    background: #568057;
    border-color: #568057;
    color: white;
}

.seat.matthew {
    background: #d40000;
    border-color: #d40000;
    animation: pulse 0.5s;
}

.seat-img {
    width: 40x;
    height: 40px;
    object-fit: cover; 
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.result {
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

.result.level-1 { background: #511d1d; color: white; }
.result.level-2 { background: #8c6318; color: white; }
.result.level-3 { background: #bb9d24; color: #333; }
.result.level-4 { background: #394b39; color: white; }

.btn {
    background: #383e5a;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}


.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="game-container">

    <div id="welcomeScreen">
        <h1>Can you survive Matthew's atrocious fart?</h1>
        <p class="subtitle">Choose wisely...some seats are dangerous.</p>
        <button class="btn" id="playBtn">Play</button>
    </div>

    <div id="gameScreen" class="hidden">
        <h1>The windows are closed on the plane and Matthew just farted.</h1>
        <p>Choose somewhere to sit!</p>
        <P> </P>

        <div class="grid" id="grid"></div>

        <div id="result" class="result hidden"></div>

        <button class="btn hidden" id="resetBtn">Play Again</button>
    </div>

</div>

<script>
const grid = document.getElementById('grid');
const result = document.getElementById('result');
const resetBtn = document.getElementById('resetBtn');
const playBtn = document.getElementById('playBtn');
const welcomeScreen = document.getElementById('welcomeScreen');
const gameScreen = document.getElementById('gameScreen');

let matthewPosition;
let gameActive = true;

playBtn.addEventListener('click', () => {
    welcomeScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    initGame();
});

function initGame() {
    grid.innerHTML = '';
    result.classList.add('hidden');
    resetBtn.classList.add('hidden');
    gameActive = true;

    matthewPosition = Math.floor(Math.random() * 16);

    for (let i = 0; i < 16; i++) {
        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.innerHTML = '💺';
        seat.addEventListener('click', () => selectSeat(i, seat));
        grid.appendChild(seat);
    }
}

function selectSeat(position, seatElement) {
    if (!gameActive) return;
    gameActive = false;

    seatElement.classList.add('selected');
    seatElement.innerHTML = '🫵';

    const matthewSeat = grid.children[matthewPosition];
    matthewSeat.classList.add('matthew');
    matthewSeat.innerHTML = '<img src="matthew.png" class="seat-img" alt="Mr. Tran">';



    const distance = calculateDistance(position, matthewPosition);

    setTimeout(() => {
        showResult(distance);
    }, 400);
}

function calculateDistance(pos1, pos2) {
    const row1 = Math.floor(pos1 / 4);
    const col1 = pos1 % 4;
    const row2 = Math.floor(pos2 / 4);
    const col2 = pos2 % 4;
    return Math.abs(row1 - row2) + Math.abs(col1 - col2);
}

function showResult(distance) {
    result.classList.remove('hidden', 'level-1', 'level-2', 'level-3', 'level-4');
    resetBtn.classList.remove('hidden');

    if (distance === 0) {
        result.textContent = 'You and Matthew chose the same seat...you are doomed!';
        result.classList.add('level-1');
    } else if (distance <= 2) {
        result.textContent = 'You might as well have died from the smell.';
        result.classList.add('level-2');
    } else if (distance <= 4) {
        result.textContent = 'Quick! You still have time. Run like a Raider!';
        result.classList.add('level-3');
    } else {
        result.textContent = 'You are far enough. Better be prepared though!';
        result.classList.add('level-4');
    }
}

resetBtn.addEventListener('click', () => {
    gameScreen.classList.add('hidden');
    welcomeScreen.classList.remove('hidden');
});
</script>

</body>
</html>
